<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCV CHAT & TRANS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif;}
  body{
    height:100vh;
    background: linear-gradient(135deg, #0a84ff 0%, #00d4aa 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .container{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background: linear-gradient(120deg, rgba(0,122,255,0.9), rgba(0,214,143,0.8));
    text-align:center;
    padding:20px;
  }
  .logo{
    font-size:25vw;
    font-weight:900;
    color: transparent;
    background: linear-gradient(90deg, #0066cc, #00b386);
    -webkit-background-clip: text;
    background-clip: text;
    line-height:1;
    letter-spacing:-5px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo span{ position:relative; }
  .logo .c{ 
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .globe{
    position:absolute;
    width:45%;
    height:45%;
    background: white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.15em;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
  }
  .text-bottom{
    margin-top:10px;
    font-size:5vw;
    letter-spacing:3px;
    font-weight:600;
    color: #0a5a8a;
    text-transform: uppercase;
  }
  .btn{
    margin-top:40px;
    background:white;
    color:#333;
    border:none;
    padding:16px 32px;
    border-radius:50px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display:flex;
    align-items:center;
    gap:10px;
  }
  /* Para laptop se hace más pequeño y elegante */
  @media(min-width:768px){
    .logo{ font-size:12vw; }
    .text-bottom{ font-size:2vw; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span>J</span><span class="c">C<div class="globe">🌍</div></span><span>V</span>
    </div>
    <div class="text-bottom">CHAT & TRANS</div>
    
    <button class="btn" onclick="window.location.href='/chat.html'">
      <img src="https://www.google.com/favicon.ico" width="20"> ENTRAR CON GOOGLE
    </button>
  </div>
</body>
</html>
