<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JCV CHAT & TRANS</title></head>
<body>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB... pon aquí tu apiKey de Firebase",
  authDomain: "jcv-chat-trans.firebaseapp.com",
  projectId: "jcv-chat-trans",
  appId: "1:..."
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const btn = document.getElementById('loginBtn');
btn.onclick = () => signInWithRedirect(auth, provider);

getRedirectResult(auth).then((res)=>{
  if(res){ location.href = "chat.html"; }
});
</script>

<div style="height:100vh;background:linear-gradient(135deg,#0a84ff,#00e6a0);display:flex;flex-direction:column;align-items:center;justify-content:center">
  <div style="font-size:100px;font-weight:900;color:#0056b3">JCV</div>
  <div style="letter-spacing:4px;font-weight:700;color:#0b4a7a">CHAT & TRANS</div>
  <button id="loginBtn" style="margin-top:30px;background:white;border:0;padding:16px 28px;border-radius:99px;font-weight:800;box-shadow:0 10px 20px rgba(0,0,0,.2)">G ENTRAR CON GOOGLE</button>
</div>
</body>
</html>
