name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          cd app/JCVTraductorapp
          chmod +x../../gradlew 2>/dev/null || echo "no gradlew"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JCV-Traductor-APK
          path: app/JCVTraductorapp/build/outputs/apk/debug/*.apk
